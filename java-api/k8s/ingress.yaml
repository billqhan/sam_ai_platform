apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-api-ingress
  namespace: sam-ai
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-port: '8081'
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/success-codes: '200'
    # Certificate ARN (replace with your ACM certificate)
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:160936122037:certificate/your-cert-id
    # Security
    alb.ingress.kubernetes.io/security-groups: sg-xxxx  # Replace with your security group
    # Tags
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=SAM-AI,ManagedBy=Kubernetes
spec:
  rules:
  - host: api.sam-ai.dev.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: java-api-internal
            port:
              number: 8080
      - path: /actuator
        pathType: Prefix
        backend:
          service:
            name: java-api-internal
            port:
              number: 8081
