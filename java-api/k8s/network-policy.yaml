# Network Policy to restrict traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: java-api-network-policy
  namespace: sam-ai
spec:
  podSelector:
    matchLabels:
      app: java-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system  # Allow ingress controller
    - podSelector:
        matchLabels:
          app: java-api  # Allow pod-to-pod
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: java-api  # Allow pod-to-pod
  - to:  # Allow AWS API calls
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  - to:  # Allow DNS
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
